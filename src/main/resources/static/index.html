<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatheroo - Continent Averages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <i class="fas fa-cloud-sun text-white text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Weatheroo</h1>
            </div>
            <div class="flex space-x-4">
                <button onclick="fetchAverages()" class="text-slate-600 hover:text-blue-600 px-3 py-2 text-sm font-medium transition">
                    <i class="fas fa-sync-alt mr-1"></i> Refresh Data
                </button>
                <button onclick="triggerSync()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition shadow-sm flex items-center">
                    <i class="fas fa-bolt mr-2"></i> Manual Sync
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <!-- Dashboard Info -->
        <div class="mb-10">
            <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Global Weather Dashboard</h2>
            <p class="text-slate-500 max-w-2xl">Average temperatures across continents calculated from historical data of representative major cities over the past 6 months.</p>
        </div>

        <!-- Notification Toast -->
        <div id="toast" class="hidden fixed bottom-5 right-5 bg-slate-900 text-white px-6 py-4 rounded-xl shadow-2xl transition-all transform translate-y-20 flex items-center space-x-3 z-50">
            <i class="fas fa-info-circle text-blue-400"></i>
            <span id="toast-message"></span>
        </div>

        <!-- Cards Grid -->
        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Loading Skeletons -->
            <div class="animate-pulse bg-white p-8 rounded-3xl border border-slate-100 shadow-sm h-64"></div>
            <div class="animate-pulse bg-white p-8 rounded-3xl border border-slate-100 shadow-sm h-64"></div>
            <div class="animate-pulse bg-white p-8 rounded-3xl border border-slate-100 shadow-sm h-64"></div>
        </div>
    </main>

    <script>
        const API_BASE = '/api/v1/weather';

        async function fetchAverages() {
            const container = document.getElementById('cards-container');
            try {
                const response = await fetch(`${API_BASE}/averages`);
                const data = await response.json();
                
                container.innerHTML = '';
                
                data.forEach(item => {
                    const card = createCard(item);
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error fetching data:', error);
                showToast('Failed to fetch weather data. Please ensure the server is running.', 'bg-red-600');
            }
        }

        function createCard(item) {
            const div = document.createElement('div');
            div.className = 'bg-white p-8 rounded-3xl border border-slate-100 shadow-sm hover:shadow-xl hover:border-blue-100 transition-all duration-300 group';
            
            const hasData = item.avgTempC !== null;
            
            div.innerHTML = `
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <span class="text-xs font-bold text-blue-600 uppercase tracking-widest mb-1 block">${item.period}</span>
                        <h3 class="text-2xl font-bold text-slate-800">${item.continent}</h3>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl group-hover:bg-blue-50 transition">
                        <i class="fas fa-map-marked-alt text-slate-400 group-hover:text-blue-500"></i>
                    </div>
                </div>
                
                <div class="flex items-end space-x-4 mb-6">
                    <div class="text-5xl font-extrabold text-slate-900">
                        ${hasData ? item.avgTempC.toFixed(1) : '--'}
                        <span class="text-2xl font-normal text-slate-400">°C</span>
                    </div>
                    <div class="text-xl font-semibold text-slate-400 mb-1">
                        / ${hasData ? item.avgTempF.toFixed(1) : '--'}
                        <span class="text-sm font-normal text-slate-500">°F</span>
                    </div>
                </div>

                <div class="border-t border-slate-50 pt-6">
                    <div class="flex items-center text-slate-400 text-sm font-medium mb-3">
                        <i class="fas fa-city mr-2 text-xs"></i> Representative Cities
                    </div>
                    <div class="flex flex-wrap gap-2">
                        ${item.sourceCities.map(city => `
                            <span class="bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-semibold group-hover:bg-blue-50 group-hover:text-blue-600 transition">
                                ${city}
                            </span>
                        `).join('')}
                    </div>
                </div>
            `;
            return div;
        }

        async function triggerSync() {
            try {
                const response = await fetch(`${API_BASE}/sync`, { method: 'POST' });
                const message = await response.text();
                showToast(message);
                // Wait a bit and refresh UI to see if any data started appearing
                setTimeout(fetchAverages, 2000);
            } catch (error) {
                showToast('Failed to trigger synchronization.', 'bg-red-600');
            }
        }

        function showToast(message, colorClass = 'bg-slate-900') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            
            toastMsg.innerText = message;
            toast.className = `fixed bottom-5 right-5 text-white px-6 py-4 rounded-xl shadow-2xl transition-all transform flex items-center space-x-3 z-50 ${colorClass}`;
            
            toast.classList.remove('hidden', 'translate-y-20');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20');
                setTimeout(() => toast.classList.add('hidden'), 500);
            }, 5000);
        }

        // Initial Load
        document.addEventListener('DOMContentLoaded', fetchAverages);
    </script>
</body>
</html>
