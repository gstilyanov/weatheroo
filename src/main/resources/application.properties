spring.application.name=weatheroo

# API Configuration
weather.api.key=${WEATHER_API_KEY}
weather.api.url=https://api.weatherapi.com/v1
weather.sync.delay=250

# City Configuration (The Map)
weather.cities.EUROPE=London,Paris,Berlin,Madrid,Rome
weather.cities.ASIA=Tokyo,Beijing,Mumbai,Seoul,Jakarta
weather.cities.NORTH_AMERICA=New York,Los Angeles,Toronto,Mexico City,Chicago
weather.cities.SOUTH_AMERICA=Sao Paulo,Buenos Aires,Bogota,Lima,Santiago
weather.cities.AFRICA=Cairo,Johannesburg,Lagos,Nairobi,Casablanca
weather.cities.OCEANIA=Sydney,Auckland,Perth,Melbourne,Brisbane

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/weatheroo
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
